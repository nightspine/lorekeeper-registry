name: Publish
on:
  push:
    branches: [main]
    paths: ["indexes/**", "removed.json", "site/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Share]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from "git+https://github.com/nightspine/lorekeeper@main" lorekeeper registry build . -o _site --base-path /lorekeeper-registry --name "Lorekeeper community registry"
      - run: python3 site/make_catalog.py . _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
